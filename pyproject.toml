[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dabam2d"
version = "2026.11.26"
description = "Tools for two-dimensional X-ray optics metrology"
requires-python = ">=3.10"
dependencies = ["numpy", "h5py", "matplotlib>=3.6"]
readme = "README.md"
license = "CECILL-2.1"
license-files = ["LICENSE", "LICENSE-MIT"]

[tool.setuptools.packages.find]
where = ["src"]
