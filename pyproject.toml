[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dabam2d"
version = "2026.11.25"
description = "Tools for two-dimensional X-ray optics metrology"
readme = "README.md"
license = "CECILL-2.1"
license-files = ["LICENSE", "LICENSE-MIT"]

[tool.setuptools.packages.find]
where = ["src"]
